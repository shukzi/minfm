[package]
name = "minfm"
version = "0.4.0"
edition = "2021"
description = "minfm is a minimal terminal file manager for Linux, written in Rust. It provides intuitive keyboard navigation and integrated disk management (including LUKS functionality)."
license = "MIT"
repository = "https://github.com/shukzi/minfm"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
filetime = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs", "user"] }
percent-encoding = "2.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
unicode-width = "0.2"
xattr = "1.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
